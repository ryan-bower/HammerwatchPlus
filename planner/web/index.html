<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Planner</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --panel-2:#faf8f4; --ink:#1d1c1a; --muted:#6b675f; --line:#e2ded5;
  --accent:#b4501e; --accent-ink:#ffffff; --focus:#d9772f; --remaster:#7a4fc0;
  --q-common:#7a7a7a; --q-uncommon:#2f8a3c; --q-rare:#2c6fc4; --q-epic:#8a3fc4;
  --s-idea:#9a948a; --s-designed:#c08a1e; --s-built:#2c6fc4; --s-tested:#2f8a3c; --s-finished:#1f6b4a; --c-red:#c0392b; --c-yellow:#d4a017; --c-green:#2f9a46;
  --active:#b4501e; --passive:#5a6bb0; --warn:#b03a2e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --ico-bg:#2b2622;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --panel:#1e1c19; --panel-2:#24221e; --ink:#ece8e0; --muted:#a29d93; --line:#34312b;
    --accent:#e0743a; --accent-ink:#1a0f08; --focus:#f0904f; --remaster:#b08cf0;
    --q-common:#a3a3a3; --q-uncommon:#5cc46a; --q-rare:#5c9cf0; --q-epic:#b57af0;
    --s-idea:#8c877e; --s-designed:#e0aa3e; --s-built:#5c9cf0; --s-tested:#5cc46a; --s-finished:#3fd29a; --c-red:#e0645a; --c-yellow:#e8c13a; --c-green:#5cc46a;
    --active:#e0743a; --passive:#8b9be0; --warn:#e06a5c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --ico-bg:#0d0c0b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --panel:#1e1c19; --panel-2:#24221e; --ink:#ece8e0; --muted:#a29d93; --line:#34312b;
  --accent:#e0743a; --accent-ink:#1a0f08; --focus:#f0904f; --remaster:#b08cf0;
  --q-common:#a3a3a3; --q-uncommon:#5cc46a; --q-rare:#5c9cf0; --q-epic:#b57af0;
  --s-idea:#8c877e; --s-designed:#e0aa3e; --s-built:#5c9cf0; --s-tested:#5cc46a; --s-finished:#3fd29a; --c-red:#e0645a; --c-yellow:#e8c13a; --c-green:#5cc46a;
  --active:#e0743a; --passive:#8b9be0; --warn:#e06a5c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --ico-bg:#0d0c0b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:20px 0 10px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-idea)}
.dot.ok{background:var(--s-tested)} .dot.bad{background:var(--warn)}
.clsbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.clsbar button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.clsbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.clsbar .mini{width:7px;height:7px;border-radius:50%}
.clsbar.second{padding-top:0}
.clsbar .rowlabel{flex:none;align-self:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-right:2px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.small{padding:2px 8px;font-size:12px}
.ro .needs-write{display:none!important}
.brief{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.brief h2{margin:0 0 6px;font-size:16px}
.brief p{margin:6px 0 0}
.owner{font-weight:650;color:var(--accent);margin-top:-4px}
.notice{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);margin-bottom:14px;font-size:13px}
.grid{display:grid;gap:14px}
.cols-4{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.doctrine{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.doctrine.new{border:2px solid var(--accent)}
.doctrine.remastered{border:2px solid var(--remaster)}
.doctrine.remastered>h2,.spechead.remastered{color:var(--remaster)}
.doctrine>h2{display:flex;align-items:center;gap:8px;font-size:15px;margin:0}
.doctrine .blurb{color:var(--muted);font-size:12.5px;margin:-4px 0 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.title{font-weight:650;font-size:14.5px;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap;text-transform:lowercase}
.kind-active{color:var(--active)} .kind-passive{color:var(--passive)}
.chip.van{color:var(--muted)}
.st-idea{color:var(--s-idea)} .st-designed{color:var(--s-designed)} .st-built{color:var(--s-built)} .st-tested{color:var(--s-tested)} .st-finished{color:var(--s-finished)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.summary{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.vdesc{margin:6px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.levels{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:12.5px}
.levels li{display:grid;grid-template-columns:28px 1fr;gap:6px}
.levels b{color:var(--muted);font-weight:600}
.mods{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;background:var(--panel-2);cursor:pointer;border:1px solid transparent}
.mod:hover{border-color:var(--line)}
.mod.static{cursor:default;grid-template-columns:auto 1fr}
.mod.static:hover{border-color:transparent}
.pips{display:flex;gap:3px;padding-top:4px}
/* game icons: 24px cells of icons.png drawn at 2x, pixels kept sharp */
.ico{display:inline-block;flex:none;border-radius:5px;background-color:var(--ico-bg);background-image:url(icons.png);background-repeat:no-repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.ico.none{background:none;box-shadow:none;border:1px dashed var(--line)}
.mi{display:grid;gap:4px;justify-items:center;align-content:start}
.mi .pips{padding-top:0}
.pip{width:9px;height:9px;border-radius:2px}
.q-common{background:var(--q-common)} .q-uncommon{background:var(--q-uncommon)} .q-rare{background:var(--q-rare)} .q-epic{background:var(--q-epic)}
details.vm{margin-top:8px}
details.vm>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
details.vm>summary::-webkit-details-marker{display:none}
details.vm>summary::before{content:"▸ "} details.vm[open]>summary::before{content:"▾ "}
details.vm .mods{margin-top:6px}
table.lvt{width:auto;max-width:100%;margin-top:6px;font-size:12px;border-radius:6px;box-shadow:none}
table.lvt th,table.lvt td{padding:3px 8px}
table.lvt th{font-size:10.5px}
table.lvt .pip{display:inline-block;vertical-align:-1px}
.orbsum{font-size:13px;color:var(--muted);margin:-6px 0 12px}
h3.spechead{font-size:14px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.excl{font-size:11px;color:var(--warn);font-weight:600}
.clickable{cursor:pointer}
.clickable:hover{border-color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.stat{background:var(--panel-2);border-radius:7px;padding:6px 8px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-weight:650;overflow-wrap:anywhere}
.para{margin-top:8px;font-size:13px}
.para .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
tr.clickable:hover td{background:var(--panel-2)}
.tablewrap{overflow-x:auto}
.meter{margin:6px 0 14px}
.meter .bar{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.meter .fill{height:100%;background:var(--accent)}
.meter .fill.over{background:var(--warn)}
.meter .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.rounds{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}
.round{width:10px;height:22px;border-radius:3px 3px 2px 2px;background:var(--accent)}
.round.spent{background:var(--line)}
.sectionhead{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.sectionhead h2{margin:0;font-size:16px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-b{padding:14px 16px;display:grid;gap:12px}
.dlg-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea,.lv input,.lv select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
label.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{display:grid;gap:6px}
.lvrow{display:grid;grid-template-columns:28px auto 1fr auto;gap:6px;align-items:center}
.lvrow.noq{grid-template-columns:28px 1fr auto}
.lvrow b{font-size:12px;color:var(--muted)}
.err{color:var(--warn);font-size:13px}
@media (max-width:560px){.two{grid-template-columns:1fr} h1{font-size:19px} .sync{margin-left:0;width:100%}}
[hidden]{display:none!important}
</style>
</head><body>

<div class="wrap" id="app">
  <header>
    <h1 id="clsTitle">Class Planner</h1>
    <span class="sub">HammerwatchPlus class planner</span>
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></span>
  </header>
  <div class="clsbar" id="clsbar" role="group" aria-label="Class"></div>
  <div class="clsbar second" id="clsbar2" role="group" aria-label="HoH1 classes, parked"></div>
  <nav role="tablist" id="tabs"></nav>
  <div id="notice"></div>
  <main id="view"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-h"><strong id="dlgTitle" class="grow"></strong><button class="btn small" value="cancel" formnovalidate>Close</button></div>
    <div class="dlg-b" id="dlgBody"></div>
    <div class="dlg-f">
      <button class="btn danger needs-write" type="button" id="dlgDelete">Delete</button>
      <span class="grow err" id="dlgErr"></span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary needs-write" type="button" id="dlgSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
const STATUSES = ["idea","designed","built","tested","finished"];
const QUALITIES = ["common","uncommon","rare","epic"];
const COLLECTIONS = ["classes","doctrines","skills","mods","weapons","stacks","attributes","reference"];
const FIREARMS = "hwp_firearms";

// Field schemas drive both the cards and the edit dialog.
const SCHEMA = {
  doctrines: {label:"Specialization", fields:[
    ["name","text","Name"],["status","status","Status"],["order","number","Order"],["owner","text","Assigned to"],
    ["blurb","textarea","Fantasy / role"],["notes","textarea","Notes"]]},
  skills: {label:"Skill", fields:[
    ["name","text","Name"],["status","status","Status"],
    ["group","doctrine","Specialization"],["kind","select:active,passive","Kind"],
    ["unlock","select:free,bought","Unlock"],["role","select:,grenade,reload,weapon,summon","Role"],
    ["order","number","Order"],["built","text","In-game id / file"],
    ["mana","text","Mana cost"],["cooldown","text","Cooldown"],
    ["summary","textarea","What it does"],
    ["levels","levels5","Skill levels 1-5"],["notes","textarea","Notes"]]},
  mods: {label:"Orb mod", fields:[
    ["name","text","Name"],["status","status","Status"],
    ["skill","skill","Parent skill"],["exclusive","text","Exclusive group (blank = stacks freely)"],
    ["order","number","Order"],["built","text","In-game id"],
    ["summary","textarea","What it does"],
    ["levels","levelsq","Mod levels (1-3), quality each"],["notes","textarea","Notes"]]},
  weapons: {label:"Weapon", fields:[
    ["name","text","Name"],["status","status","Status"],
    ["slot","select:mainhand,offhand,twohand,doctrine","Slot"],["order","number","Order"],
    ["clip","number","Magazine (clip add-max)"],["reload","text","Reload"],
    ["damage","text","Damage"],["rate","text","Fire rate"],
    ["spread","text","Spread"],["mana","text","Mana use"],
    ["primary","textarea","Left click"],["secondary","textarea","Right click"],
    ["pairing","textarea","Pairing rules"],["built","text","In-game ids"],["notes","textarea","Notes"]]},
  stacks: {label:"Stack", fields:[
    ["name","text","Name"],["status","status","Status"],["order","number","Order"],
    ["max","text","Max"],["timer","text","Timer"],
    ["gain","textarea","Gained by"],["spent","textarea","Spent by"],
    ["empty","textarea","On reaching 0"],["modifiers","textarea","What modifies it"],
    ["built","text","In-game id"],["notes","textarea","Notes"]]},
  attributes: {label:"Attribute", fields:[
    ["name","text","Gun attribute"],["order","number","Order"],
    ["stat","text","Vanilla stat / rail"],["trinkets","textarea","Items / trinkets that feed it"],
    ["notes","textarea","Notes"]]},
  reference: {label:"Targets", fields:[
    ["actives","number","Actives per class"],["passives","number","Passives per class"],
    ["modsTarget","number","Orb mods target"],["levelsTarget","number","Mod levels target"],
    ["baseMods","text","Vanilla base-kit mods"],["specMods","text","Vanilla mods per spec"],
    ["notes","textarea","Notes"]]},
  classes: {label:"Class notes", fields:[["notes","textarea","Notes for this class's 4th spec"]]},
};

const TABS_FIREARMS = [["class","Class tree"],["orbs","Orb mods"],["grenade","Grenade"],["arsenal","Arsenal"],["clip","Clip & reload"],["attributes","Attributes"],["budget","Budget"],["overview","All classes"]];
const TABS_VANILLA = [["class","Specializations"],["orbs","Orbs"],["budget","Budget"],["overview","All classes"]];
const state = {tab:"class", cls:FIREARMS, data:{}, db:null, canWrite:false, ready:false};
COLLECTIONS.forEach(c => state.data[c] = new Map());
try { const t = localStorage.getItem("fp.tab"); if (t) state.tab = t; } catch {}
try { const c = localStorage.getItem("fp.cls"); if (c) state.cls = c; } catch {}
if (location.hash.length > 1) state.cls = decodeURIComponent(location.hash.slice(1));   // a link to one class: #ranger

const $ = s => document.querySelector(s);
// Skill and orb icons cut from the game's atlases (icons.json: in-game id -> cell of icons.png).
let ICONS = {cell:24, cols:16, icons:{}};
const iconOf = r => r ? [r.built, r.id, r._id].find(k => k && ICONS.icons[k] !== undefined) : undefined;
function ico(r, size = 48){
  const k = iconOf(r), st = "width:"+size+"px;height:"+size+"px";
  if (k === undefined) return h("span",{class:"ico none", style:st, title:"No in-game icon yet"});
  const i = ICONS.icons[k], c = ICONS.cols;
  return h("span",{class:"ico", role:"img", "aria-label":(r.name||k)+" icon", title:k,
    style:st+";background-size:"+(c*size)+"px auto;background-position:-"+(i%c)*size+"px -"+Math.floor(i/c)*size+"px"});
}
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; el.append(k instanceof Node ? k : String(k)); }
  return el;
}
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 999; };
const sortRecs = rs => rs.sort((a,b) => (num(a.order)-num(b.order)) || String(a.name||"").localeCompare(String(b.name||"")));
const list = c => sortRecs([...state.data[c].values()]);
// Records with no class field belong to the Firearms Specialist (they predate the other classes).
const clsOf = r => r.cls || FIREARMS;
const mine = (c, cls = state.cls) => list(c).filter(r => clsOf(r) === cls);
const chip = (cls, text) => h("span",{class:"chip "+cls}, text);
const statusChip = s => chip("st-"+(STATUSES.includes(s)?s:"idea"), s || "idea");
const qualityOf = lv => QUALITIES.includes(lv && lv.q) ? lv.q : "common";
const classDoc = (cls = state.cls) => state.data.classes.get(cls);
const isVanilla = (cls = state.cls) => !!classDoc(cls)?.vanilla;
// Where read-only game records come from: the game itself, or a port (the HoH1 classes of mods/classes).
const srcOf = (x, c = classDoc()) => { const p = (x && x.port) || (c && c.port); return p ? p+" port" : "vanilla"; };
const tabsFor = () => isVanilla() ? TABS_VANILLA : TABS_FIREARMS;
const classes = () => list("classes").length ? list("classes") : [{_id:FIREARMS, name:"Firearms Specialist", order:0}];
function vanillaSkills(cls = state.cls){
  const c = classDoc(cls); if (!c || !c.vanilla) return [];
  return [...(c.base||[]).map(s => ({...s, spec:"Base kit"})), ...(c.specs||[]).flatMap(sp => (sp.skills||[]).map(s => ({...s, spec:sp.name})))];
}
function skillName(id){
  const r = state.data.skills.get(id); if (r) return r.name || id;
  for (const c of state.data.classes.values()) for (const s of [...(c.base||[]), ...(c.specs||[]).flatMap(sp => sp.skills||[])]) if (s.id === id) return s.name;
  return id;
}

// ---------- rendering ----------
// A class's dot: red while anything of its own is still an idea or only designed, yellow once all
// of it is built (built or tested, not yet balanced), green when all of it is finished. The
// Echoes of Hammerwatch I specs (remastered) are parked and don't count; a class's own `status`
// (the ported and HoH1 classes) counts with its records.
function classProgress(c){
  const remSpecs = new Set(mine("doctrines", c._id).filter(d => d.remastered).map(d => d._id));
  const docs = mine("doctrines", c._id).filter(d => !d.remastered);
  const sk = mine("skills", c._id).filter(s => !remSpecs.has(s.group));
  const remSk = new Set(mine("skills", c._id).filter(s => remSpecs.has(s.group)).map(s => s._id));
  const recs = [...docs, ...sk, ...mine("mods", c._id).filter(m => !remSk.has(m.skill)),
    ...(c._id === FIREARMS ? [...mine("weapons", c._id), ...mine("stacks", c._id)] : [])];
  const sts = recs.map(r => r.status || "idea");
  if (c.status) sts.push(c.status);
  if (c.vanilla && !c.port && !docs.length) sts.push("idea");   // no 4th spec yet
  if (!sts.length) return null;

// ---------- editor ----------
let editing = null;
function fieldInput(coll, key, type, val){
  if (type === "textarea") return h("textarea",{name:key}, val ?? "");
  if (type === "number") return h("input",{name:key, type:"number", step:"any", value: val ?? ""});
  if (type === "status") return h("select",{name:key}, STATUSES.map(s => h("option",{value:s, selected:(val||"idea")===s}, s)));
  if (type.startsWith("select:")) return h("select",{name:key}, type.slice(7).split(",").map(s => h("option",{value:s, selected:(val||"")===s}, s||"—")));
  if (type === "doctrine") return h("select",{name:key}, mine("doctrines").map(d => h("option",{value:d._id, selected:val===d._id}, d.name||d._id)));
  if (type === "skill"){
    const own = mine("skills"), van = vanillaSkills();
    const opts = [h("optgroup",{label:"New skills"}, own.map(s => h("option",{value:s._id, selected:val===s._id}, s.name||s._id)))];
    const specs = [...new Set(van.map(s => s.spec))];
    for (const sp of specs) opts.push(h("optgroup",{label:"Vanilla · "+sp}, van.filter(s => s.spec === sp).map(s => h("option",{value:s.id, selected:val===s.id}, s.name))));
    return h("select",{name:key}, opts);
  }
  if (type === "levels5") return levelsEditor(key, Array.isArray(val)?val:[], false);
  if (type === "levelsq") return levelsEditor(key, Array.isArray(val)?val:[], true);
  return h("input",{name:key, type:"text", value: val ?? ""});
}
function levelsEditor(key, vals, withQ){
  const box = h("div",{class:"lv","data-levels":key,"data-q":withQ?"1":""});
  const rows = withQ ? vals.map(v => ({q:qualityOf(v), text:v.text||""})) : Array.from({length:5}, (_,i) => vals[i] || "");
  function draw(){
    box.replaceChildren(
      ...rows.map((r,i) => withQ
        ? h("div",{class:"lvrow"}, h("b",null,"L"+(i+1)),
            h("select",{"data-i":i,"data-f":"q", onchange:e=>rows[i].q=e.target.value}, QUALITIES.map(q => h("option",{value:q, selected:r.q===q}, q))),
            h("input",{type:"text", value:r.text, placeholder:"effect at this level", oninput:e=>rows[i].text=e.target.value}),
            h("button",{class:"btn small", type:"button", onclick:()=>{rows.splice(i,1); draw();}}, "×"))
        : h("div",{class:"lvrow noq"}, h("b",null,"L"+(i+1)), h("input",{type:"text", value:r, placeholder:"values at level "+(i+1), oninput:e=>rows[i]=e.target.value}), h("span"))),
      withQ && rows.length < 3 ? h("div",null, h("button",{class:"btn small", type:"button", onclick:()=>{rows.push({q: rows.length ? rows[rows.length-1].q : "common", text:""}); draw();}}, "+ level")) : null);
  }
  box._rows = rows; draw();
  return box;
}
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60); }
function openEditor(coll, id, preset){
  const sc = SCHEMA[coll], rec = id ? state.data[coll].get(id) : null;
  const pre = Object.assign({}, preset||{}); delete pre._newId;
  const body = rec ? structuredClone(stripMeta(rec)) : Object.assign({status:"idea"}, pre);
  editing = {coll, id, newId: preset && preset._newId, preset: pre};
  $("#dlgTitle").textContent = (rec ? (state.canWrite ? "Edit " : "") : "New ")+sc.label.toLowerCase()+(rec ? ": "+(rec.name||id) : "");
  $("#dlgErr").textContent = "";
  $("#dlgDelete").hidden = !rec || coll === "classes";
  const b = $("#dlgBody"); b.replaceChildren();
  const pairs = sc.fields.filter(f => !["textarea","levels5","levelsq"].includes(f[1]));
  const wide = sc.fields.filter(f => ["textarea","levels5","levelsq"].includes(f[1]));
  if (pairs.length){ const two = h("div",{class:"two"}); for (const [k,t,l] of pairs) two.append(h("label",{class:"f"}, l, fieldInput(coll,k,t,body[k]))); b.append(two); }
  for (const [k,t,l] of wide) b.append(t.startsWith("levels") ? h("div",{class:"f"}, h("label",{class:"f"}, l), fieldInput(coll,k,t,body[k])) : h("label",{class:"f"}, l, fieldInput(coll,k,t,body[k])));
  b.querySelectorAll("input,select,textarea").forEach(el => el.disabled = !state.canWrite);
  if (rec) b.append(h("div",{class:"mono"}, coll+"/"+id));
  $("#dlg").showModal();
}
function stripMeta(r){ const o = {...r}; delete o._id; return o; }
function collect(){
  const {coll} = editing, out = {};
  for (const [k,t] of SCHEMA[coll].fields){
    if (t.startsWith("levels")){
      const box = $("#dlgBody").querySelector('[data-levels="'+k+'"]');
      const rows = box._rows;
      out[k] = t === "levelsq" ? rows.map(r => ({q:r.q, text:r.text.trim()})) : rows.map(r => String(r).trim());
      if (t === "levels5"){ while (out[k].length && !out[k][out[k].length-1]) out[k].pop(); }
      continue;
    }
    const el = $("#dlgBody").querySelector('[name="'+k+'"]');
    if (!el) continue;
    const v = el.value;
    out[k] = t === "number" ? (v === "" ? null : Number(v)) : v;
  }
  return out;
}
$("#dlgSave").addEventListener("click", async () => {
  if (!state.db || !editing) return;
  const {coll, id, newId, preset} = editing;
  const prev = id ? state.data[coll].get(id) : null;
  const body = Object.assign({}, prev ? stripMeta(prev) : preset, collect());
  let docId = id || newId || slug(body.name) || null;
  if (!id && docId && state.data[coll].has(docId)) docId = docId + "-" + Math.random().toString(36).slice(2,6);
  const btn = $("#dlgSave"); btn.disabled = true; $("#dlgErr").textContent = "";
  try {
    const ref = docId ? state.db.collection(coll).doc(docId) : state.db.collection(coll).doc();
    await ref.set(body);
    $("#dlg").close();
  } catch (e) {
    $("#dlgErr").textContent = "Couldn't save ("+(e && e.code || "error")+").";
  } finally { btn.disabled = false; }
});
$("#dlgDelete").addEventListener("click", async () => {
  if (!state.db || !editing || !editing.id) return;
  if (!confirm("Delete this "+SCHEMA[editing.coll].label.toLowerCase()+"?")) return;
  try { await state.db.collection(editing.coll).doc(editing.id).delete(); $("#dlg").close(); }
  catch (e) { $("#dlgErr").textContent = "Couldn't delete ("+(e && e.code || "error")+")."; }
});

// ---------- data ----------
function setSync(kind, text){ $("#syncDot").className = "dot "+(kind||""); $("#syncText").textContent = text; }
let renderQueued = false;
function queueRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; if (!$("#dlg").open) render(); else pendingRender = true; }); }
let pendingRender = false;
$("#dlg").addEventListener("close", () => { editing = null; if (pendingRender){ pendingRender = false; render(); } });

// The server keeps each record as planner/data/<collection>/<id>.json.
function api(method, coll, id, body){
  return fetch("api/"+coll+"/"+encodeURIComponent(id), {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined})
    .then(r => { if (!r.ok) throw {code: "http "+r.status}; return load(); });
}
const localDb = {collection: coll => ({doc: id => {
  id = id || coll+"-"+Math.random().toString(36).slice(2,10);
  return {set: body => api("PUT", coll, id, body), delete: () => api("DELETE", coll, id)};
}})};
let stamp = null;
async function load(){
  const j = await fetch("api/data").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  for (const c of COLLECTIONS) state.data[c] = new Map(Object.entries(j.data[c]||{}).map(([id, d]) => [id, {...d, _id:id}]));
  stamp = j.stamp;
  state.db = localDb; state.canWrite = true;
  setSync("ok","Saved to planner/data");
  queueRender();
}
// Picks up changes made outside this tab: another tab, a git pull, a hand edit.
async function poll(){
  try {
    const j = await fetch("api/stamp").then(r => r.json());
    if (j.stamp !== stamp) await load();
    else if (!state.db){ state.db = localDb; state.canWrite = true; setSync("ok","Saved to planner/data"); queueRender(); }
  } catch {
    if (state.db){ state.db = null; state.canWrite = false; setSync("bad","Server stopped"); queueRender(); }
  }
}

render();
fetch("icons.json").then(r => r.ok ? r.json() : null).then(j => { if (j && j.icons){ ICONS = j; queueRender(); } }).catch(() => {});
load().catch(() => setSync("bad","Server not running")).finally(() => { state.ready = true; render(); setInterval(poll, 2000); });
})();
