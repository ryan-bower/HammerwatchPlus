name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows: the tools and GameLab use Windows APIs. No game here, so needs_gamecode tests skip.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the release commit. Python from .python-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/test.py
        env:
          # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...), which
          # GameLab's path-alias guards refuse. runner.temp has no short-name components.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
